name: Release

# Builds, signs and publishes the Haven Android APKs when a version tag (v*) is pushed.
#
# Security model (see docs/haven-release.md):
# - The signing key and passwords are secrets of the protected "release" environment only, never repository secrets.
# - The "release" environment only accepts v* tags and requires a maintainer's approval before the job starts.
# - A repository ruleset only lets admins create, move or delete v* tags.
# - Pull requests (including from forks) never run this workflow and never see these secrets.

on:
  push:
    tags: [ 'v*' ]

permissions: {}

concurrency:
  group: ${{ format('release-{0}', github.ref_name) }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  # SHA-256 of the Haven release signing certificate (CN=Haven, O=Haven-Organization)
  HAVEN_RELEASE_CERT_SHA256: a5abf06836e679c545181b807e7eb9751518cc86af4c657d44e4c99e6b16d698

jobs:
  release:
    name: Build and publish signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: release
    permissions:
      # Required to create the GitHub release and upload the APKs.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          versionName=$(grep -m1 -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "Tag: ${tag}, versionName: ${versionName}"
          if [[ "${versionName}" != "${tag}" && "${versionName}" != "${tag}-"* ]]; then
            echo "::error::Tag v${tag} does not match versionName ${versionName} in app/build.gradle.kts"
            exit 1
          fi

      - name: Check Matrix Rust SDK is not a nightly version
        run: ./tools/release/check_no_nightly_sdk.sh

      # No Gradle cache: the release build must not depend on cache entries written by other workflow runs.
      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          free-disk-space: 'true'
          setup-gradle: 'false'

      # The keystore is only written after all third-party setup actions have run, and is deleted at the end.
      - name: Write the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HAVEN_ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::The release environment has no HAVEN_ANDROID_RELEASE_KEYSTORE_BASE64 secret"
            exit 1
          fi
          umask 077
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/haven-release.jks"

      - name: Build release APKs
        env:
          HAVEN_ANDROID_RELEASE_STOREFILE: ${{ runner.temp }}/haven-release.jks
          HAVEN_ANDROID_RELEASE_STOREPASSWORD: ${{ secrets.HAVEN_ANDROID_RELEASE_STOREPASSWORD }}
          HAVEN_ANDROID_RELEASE_KEYALIAS: ${{ secrets.HAVEN_ANDROID_RELEASE_KEYALIAS }}
          HAVEN_ANDROID_RELEASE_KEYPASSWORD: ${{ secrets.HAVEN_ANDROID_RELEASE_KEYPASSWORD }}
        run: ./gradlew assembleFdroidScDefaultRelease --stacktrace --no-daemon --no-configuration-cache

      - name: Delete the signing keystore
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/haven-release.jks"

      - name: Verify signatures and collect APKs
        run: |
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)/apksigner"
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app/build/outputs/apk/fdroidScDefault/release/app-fdroid-sc-default-${abi}-release.apk"
            digest=$("${apksigner}" verify --print-certs "${src}" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            if [[ "${digest}" != "${HAVEN_RELEASE_CERT_SHA256}" ]]; then
              echo "::error::${src} is not signed with the Haven release key (got ${digest})"
              exit 1
            fi
            cp "${src}" "dist/haven-${version}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS)
          cat dist/SHA256SUMS

      # A draft: only visible to the repository's maintainers until one of them publishes it on GitHub.
      - name: Create the GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          Haven Android ${TAG#v}, based on Element X Android and SchildiChat Next.

          **Which APK?** Most phones: \`arm64-v8a\`. Older 32-bit phones: \`armeabi-v7a\`. Emulators and x86 devices: \`x86_64\`.

          APKs are signed with the Haven release key. Certificate SHA-256:
          \`${HAVEN_RELEASE_CERT_SHA256}\`
          EOF
          gh release create "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --title "Haven Android ${TAG#v}" --notes-file notes.md --verify-tag --draft
